<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1976d2" />
    <title>Neome Wizard</title>

    <!-- Google tag (gtag.js) — same GA4 property as the old wizard
         (measurement id G-DG89L8TY93); async so it never blocks first paint. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DG89L8TY93"></script>
    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());
      gtag("config", "G-DG89L8TY93");
    </script>

    <!-- Google Tag Manager (container GTM-K4S8T42L) — owned by us; the Google
         Ads agency manages its Ads tags. Placed AFTER the gtag block above so
         GA4 initialises first, matching the ordering on the marketing site.

         Note: unlike the marketing site, this app has no cookie banner, so
         there are no Consent Mode defaults to set here — adding a denied
         default with no way to grant it would force GA4 cookieless and break
         client_id sharing with neome.ai, splitting the onboarding funnel. -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({"gtm.start": new Date().getTime(), event: "gtm.js"});
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-K4S8T42L");
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-K4S8T42L"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- Keep #root non-empty: Safari holds first paint while the page has
         nothing to render, causing a long blank screen on slow connections.
         React replaces this on mount. Plain text only — an <img> here makes
         Safari hold first paint until the image arrives. -->
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f5f5f4; font-family: -apple-system, system-ui, sans-serif; color: #a8a29e; font-size: 16px;">
        Processing&hellip;
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
