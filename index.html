<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1976d2" />
    <title>Neome Wizard</title>

    <!-- Analytics: GA4 (G-DG89L8TY93) + Google Tag Manager (GTM-K4S8T42L),
         loaded on the PRODUCTION HOST ONLY.

         The hostname is the gate because it is ground truth: staging, the
         orgbeat development environment and localhost never load either tag,
         no matter which branch or build mode produced the bundle. That is why
         analytics can now live on every branch — previously it existed only on
         main, which meant a production deploy from develop silently shipped no
         analytics, while `deployStaging` from main still sent staging traffic
         to GA4. Add a host here (or map host -> measurement id) if the wizard
         ever gains another production domain.

         Nothing downstream needs a matching guard: trackWizardEvent() in
         src/utils/analytics.ts already no-ops when window.gtag is absent.

         GA4 and GTM carry no Consent Mode defaults here, deliberately. This
         app shows no banner, so a denied default could never be granted: it
         would pin GA4 to cookieless mode, lose the _ga cookie shared on
         .neome.ai, and give wizard visitors a different client_id, splitting
         the onboarding funnel.

         The Meta Pixel is different and IS consent-gated, because it is
         advertising and cannot run cookieless at all. It reads the choice the
         visitor already made on neome.ai, carried in a cookie scoped to
         .neome.ai (written by CookieConsent there). No banner is shown here by
         design: every visitor reaches this app from the marketing site, so the
         answer always exists by the time they arrive. No cookie means no
         consent, so the Pixel simply never loads. -->
    <script>
      (function () {
        var PRODUCTION_HOSTS = ["wizard.neome.ai"];
        if (PRODUCTION_HOSTS.indexOf(window.location.hostname) === -1) {
          return;
        }

        var GA_ID = "G-DG89L8TY93";
        var GTM_ID = "GTM-K4S8T42L";

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };

        // Queue GA4 before GTM so the property is configured first.
        window.gtag("js", new Date());
        window.gtag("config", GA_ID);

        var ga = document.createElement("script");
        ga.async = true;
        ga.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
        document.head.appendChild(ga);

        window.dataLayer.push({"gtm.start": new Date().getTime(), event: "gtm.js"});

        var gtm = document.createElement("script");
        gtm.async = true;
        gtm.src = "https://www.googletagmanager.com/gtm.js?id=" + GTM_ID;
        document.head.appendChild(gtm);

        // Everything below is advertising and needs explicit consent.
        var consent = document.cookie.match(/(?:^|;\s*)neome_consent=(granted|denied)/);
        if (!consent || consent[1] !== "granted") {
          return;
        }

        var META_PIXEL_ID = "1624872309215809";
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return;
          n = f.fbq = function () {
            n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n;
          n.push = n;
          n.loaded = !0;
          n.version = "2.0";
          n.queue = [];
          t = b.createElement(e);
          t.async = !0;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
        window.fbq("init", META_PIXEL_ID);
        window.fbq("track", "PageView");
      })();
    </script>
  </head>
  <body>
    <!-- Keep #root non-empty: Safari holds first paint while the page has
         nothing to render, causing a long blank screen on slow connections.
         React replaces this on mount. Plain text only — an <img> here makes
         Safari hold first paint until the image arrives. -->
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f5f5f4; font-family: -apple-system, system-ui, sans-serif; color: #a8a29e; font-size: 16px;">
        Processing&hellip;
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
